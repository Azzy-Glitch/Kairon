[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kairon-sdk"
version = "1.0.1"
description = "Kairon telemetry SDK for Python applications - a collector, not a dependency on the Kairon platform."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Abdul Aziz Qureshi" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
fastapi = ["starlette>=0.27"]
test = ["pytest>=7.0", "starlette>=0.27", "fastapi>=0.100", "httpx>=0.24"]

[tool.setuptools.packages.find]
include = ["kairon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
