services:
  ai:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    image: kairon/ai:${KAIRON_VERSION:-dev}
    restart: unless-stopped
    environment:
      # No default: a forgotten value must fail the deployment closed, never silently start on
      # mock AI. Set to a real provider (groq, qwen, gemini), or explicitly "mock" only for a
      # deliberate non-production/test deployment.
      AI__Provider: ${KAIRON_AI_PROVIDER:?Set KAIRON_AI_PROVIDER (groq, qwen, gemini - or explicitly mock)}
      AI__Model: ${KAIRON_AI_MODEL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      KAIRON_AI_API_KEY: ${KAIRON_AI_SERVICE_KEY:?Set KAIRON_AI_SERVICE_KEY}
    networks: [kairon]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: kairon/backend:${KAIRON_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      ai:
        condition: service_healthy
    # Loopback-only by default: this backend speaks plain HTTP (see backend/Dockerfile), and the
    # SDKs deliberately refuse a remote plaintext endpoint. Directly publishing this to a public
    # interface would therefore be both insecure (credentials/telemetry in clear text over a real
    # network) and unusable (no SDK would connect to it). A TLS-terminating reverse proxy is the
    # supported way to expose this remotely - see docker-compose.cloud.tls.yml and the
    # "Centralized deployment" section of README.md. An operator who already runs their own
    # ingress/load balancer in front of this host can still override KAIRON_HTTP_BIND to publish
    # on a different interface, with that understanding.
    ports:
      - "${KAIRON_HTTP_BIND:-127.0.0.1}:${KAIRON_HTTP_PORT:-8000}:8000"
    environment:
      Persistence__Provider: SqlServer
      ConnectionStrings__DefaultConnection: ${KAIRON_SQL_CONNECTION:?Set KAIRON_SQL_CONNECTION}
      AiService__BaseUrl: http://ai:8001
      AiService__MockMode: ${KAIRON_AI_MOCK_MODE:-false}
      AiService__ApiKey: ${KAIRON_AI_SERVICE_KEY:?Set KAIRON_AI_SERVICE_KEY}
      PlatformSecurity__RequireTelemetryKey: "true"
      # The address pairing hands to SDKs. A centralized deployment must say what it actually is:
      # the loopback default only ever names the SDK's own machine, so an application would pair
      # successfully and then report telemetry into itself forever.
      Product__RequirePublicBackendUrl: "true"
      Product__BackendUrl: ${KAIRON_PUBLIC_BACKEND_URL:?Set KAIRON_PUBLIC_BACKEND_URL}
      SreSecurity__RequireOperatorKey: "true"
      SreSecurity__OperatorKey: ${KAIRON_OPERATOR_KEY:?Set KAIRON_OPERATOR_KEY}
      # Machine enrollment credential - a DIFFERENT secret from the operator key above, and
      # mandatory here: in a centralized deployment no Agent reaches the backend over loopback, so
      # without this nothing can ever enroll. Rotate by adding __1 alongside __0, moving the fleet
      # over, then dropping the old one.
      AgentEnrollmentSecurity__RequireEnrollmentKey: "true"
      AgentEnrollmentSecurity__EnrollmentKeys__0: ${KAIRON_AGENT_ENROLLMENT_KEY:?Set KAIRON_AGENT_ENROLLMENT_KEY}
      Cors__AllowedOrigins__0: ${KAIRON_ALLOWED_ORIGIN:?Set KAIRON_ALLOWED_ORIGIN}
    networks: [kairon]

networks:
  kairon:
    driver: bridge
