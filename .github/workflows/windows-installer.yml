name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Builds the desktop shell, backend, Windows Service Agent, UserAgent, and the
      # PyInstaller-packaged AI service, then compiles the Inno Setup installer.
      # Runtime and packaging dependencies are both pinned. The same manifest is consumed by the
      # local installer script, preventing CI and developer builds from silently using different
      # PyInstaller releases.
      - run: pip install -r ai-service/requirements-build.txt
      - run: choco install innosetup --yes --no-progress
      - shell: powershell
        run: ./installer/build-installer.ps1
      - name: Sign installer (if a code signing certificate is configured)
        shell: powershell
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERT_PASSWORD }}
        run: |
          # Conditional and honest: with no certificate secret configured, this step logs that the
          # installer is unsigned and exits cleanly - it never fabricates or skips silently.
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "No WINDOWS_CODE_SIGNING_CERT secret configured - the installer will ship unsigned."
            exit 0
          }

          $installer = Get-ChildItem -Path artifacts/installer -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "No installer .exe found to sign in artifacts/installer." }

          $certPath = Join-Path $env:RUNNER_TEMP "kairon-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
          try {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found on this runner." }

            & $signtool.FullName sign /f $certPath /p $env:CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }

            Write-Host "Signed $($installer.Name)."
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Kairon-Windows-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
