name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            sdk-python/pyproject.toml
      # Covers every project in the solution, including the Windows Service Agent, the
      # per-session UserAgent, and the .NET SDK - not just the backend.
      - run: dotnet test Kairon.slnx --configuration Release
      - working-directory: frontend
        run: npm ci && npm test -- --run && npm run build
      - working-directory: ai-service
        run: pip install -r requirements.txt && pytest -q
      - working-directory: sdk-python
        run: pip install build -e ".[test]" && pytest -q && python -m build
      - run: dotnet pack sdk/Kairon.SDK/Kairon.SDK.csproj -c Release -o artifacts/packages

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: kairon/backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-service/Dockerfile
          push: false
          tags: kairon/ai:ci
